stages:
  - test
  - report
  - pages

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  ALLURE_VERSION: "2.35.1"
  ALLURE_RESULTS: "target/allure-results"
  ALLURE_REPORT: "target/allure-report"

# -----------------------
# 1) Run tests & collect results
# -----------------------
unit-tests:
  image: maven:3.9.3-eclipse-temurin-17
  stage: test
  script:
    - mvn clean test
  artifacts:
    when: always
    paths:
      - target/allure-results
      - target/surefire-reports
    expire_in: 1 week
  only:
    - branches
    - merge_requests

# -----------------------
# 2) Generate Allure report
# -----------------------
allure-report:
  image: maven:3.9.3-eclipse-temurin-17
  stage: report
  needs:
    - job: unit-tests
      artifacts: true
  script:
    # Install Allure CLI
    - apt-get update -qq
    - apt-get install -qq -y wget unzip
    - wget -q https://github.com/allure-framework/allure2/releases/download/$ALLURE_VERSION/allure-$ALLURE_VERSION.zip
    - unzip -q allure-$ALLURE_VERSION.zip -d /opt/
    - export PATH=$PATH:/opt/allure-$ALLURE_VERSION/bin
    # Generate report
    - allure generate $ALLURE_RESULTS --clean -o $ALLURE_REPORT
  artifacts:
    when: always
    paths:
      - $ALLURE_REPORT
    expire_in: 1 week
  only:
    - branches
    - merge_requests

# -----------------------
# 3) Publish via GitLab Pages
# -----------------------
pages:
  stage: pages
  needs:
    - job: allure-report
      artifacts: true
  script:
    # Prepare public directory for GitLab Pages
    - mkdir -p public
    - cp -r $ALLURE_REPORT/* public/
  artifacts:
    paths:
      - public
  only:
    - branches
    - merge_requests