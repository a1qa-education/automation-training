stages:
  - test
  - allure
  - pages

variables:
  MAVEN_CLI_OPTS: "-B -V"
  ALLURE_RESULTS_DIR: "target/allure-results"
  ALLURE_REPORT_DIR: "target/allure-report"

unit-tests:
  stage: test
  image: maven:3.9.3-eclipse-temurin-17
  script:
    - mvn $MAVEN_CLI_OPTS clean test
  artifacts:
    paths:
      - target/surefire-reports
      - target/allure-results
    expire_in: 1 week

allure-report:
  stage: allure
  image: openjdk:17
  dependencies:
    - unit-tests
  script:
    # Generate Allure report
    - apt-get update && apt-get install -y wget unzip
    - wget https://github.com/allure-framework/allure2/releases/download/2.35.1/allure-2.35.1.zip
    - unzip -o allure-2.35.1.zip -d /opt/
    - export PATH=$PATH:/opt/allure-2.35.1/bin
    - allure generate $ALLURE_RESULTS_DIR --clean -o $ALLURE_REPORT_DIR
  artifacts:
    paths:
      - $ALLURE_REPORT_DIR
    expire_in: 1 week

pages:
  stage: pages
  dependencies:
    - allure-report
  script:
    - rm -rf .public
    - mkdir .public
    - cp -r target/allure-report/* .public/
  artifacts:
    paths:
      - .public
    expire_in: 1 week
  only:
    - branches
    - merge_requests
