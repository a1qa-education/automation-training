stages:
  - test
  - report
  - pages

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  ALLURE_VERSION: "2.35.1"   # valid Allure Docker tag

# ---------------------------------------
# Run tests and produce Allure results
# ---------------------------------------
unit-tests:
  image: maven:3.9.3-eclipse-temurin-17
  stage: test
  script:
    - mvn clean test
  artifacts:
    when: always
    paths:
      - target/allure-results
      - target/surefire-reports
    expire_in: 1 week
  only:
    - branches
    - merge_requests

# ---------------------------------------
# Generate Allure HTML using Allure Docker
# ---------------------------------------
allure-report:
  image: frankescobar/allure-docker-service:${ALLURE_VERSION}
  stage: report
  needs:
    - job: unit-tests
      artifacts: true
  script:
    # Generate the Allure report into target/allure-report
    - allure generate target/allure-results --clean -o target/allure-report
  artifacts:
    when: always
    paths:
      - target/allure-report
    expire_in: 1 week
  only:
    - branches
    - merge_requests

# ---------------------------------------
# Publish via GitLab Pages
# ---------------------------------------
pages:
  stage: pages
  dependencies:
    - allure-report
  script:
    - mkdir .public
    - cp -r target/allure-report/* .public
  artifacts:
    paths:
      - .public
    expire_in: 1 week
  only:
    - branches
    - merge_requests
