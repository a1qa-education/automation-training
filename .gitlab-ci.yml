stages:
  - test
  - report

variables:
  MAVEN_CLI_OPTS: "-B -V"
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

unit-tests:
  stage: test
  image: maven:3.9.2-eclipse-temurin-17
  script:
    # Clean previous build, run tests
    - mvn clean test
    # Generate Allure results locally
    - mkdir -p target/allure-results
  artifacts:
    name: "unit-tests-artifacts"
    paths:
      - target/allure-results
      - target/surefire-reports
    expire_in: 1 week
    when: always

allure-report:
  stage: report
  image: frankescobar/allure-docker-service:2.35.1
  dependencies:
    - unit-tests
  script:
    # Generate Allure report from downloaded results
    - allure generate target/allure-results --clean -o target/allure-report
  artifacts:
    name: "allure-report"
    paths:
      - target/allure-report
    expire_in: 1 week
  only:
    - branches
    - merge_requests
