stages:
  - test
  - report

variables:
  MAVEN_CLI_OPTS: "-B -Dmaven.test.failure.ignore=false"

# ----------------------------
# Run Unit & BDD Tests
# ----------------------------
unit-tests:
  image: maven:3.9.3-eclipse-temurin-17
  stage: test
  script:
    - mvn $MAVEN_CLI_OPTS clean test
  artifacts:
    paths:
      - target/allure-results
      - target/surefire-reports
    expire_in: 1 week
  only:
    - branches
    - merge_requests

# ----------------------------
# Generate Allure Report
# ----------------------------
allure-report:
  image: openjdk:17
  stage: report
  dependencies:
    - unit-tests
  script:
    - apt-get update && apt-get install -y curl unzip
    # Install allure CLI if not available
    - curl -sL https://github.com/allure-framework/allure2/releases/latest/download/allure-2.27.0.zip -o allure.zip
    - unzip allure.zip -d /opt/
    - export PATH=$PATH:/opt/allure-2.27.0/bin
    - allure generate target/allure-results --clean -o target/allure-report
  artifacts:
    paths:
      - target/allure-report
    expire_in: 1 week
  only:
    - branches
    - merge_requests

# ----------------------------
# Publish Allure Report via GitLab Pages
# ----------------------------
pages:
  stage: report
  dependencies:
    - allure-report
  script:
    - mkdir .public
    - cp -r target/allure-report/* .public
  artifacts:
    paths:
      - .public
  only:
    - branches
    - merge_requests
