stages:
  - test
  - report
  - pages

unit-tests:
  stage: test
  image: maven:3.9.3-eclipse-temurin-17
  script:
    - mvn clean test
  artifacts:
    when: always
    paths:
      - target/allure-results
      - target/surefire-reports
    expire_in: 1 week

allure-report:
  stage: report
  image: frankescobar/allure-docker-service:2.35.1
  needs:
    - job: unit-tests
      artifacts: true
  script:
    - allure generate target/allure-results --clean -o target/allure-report
  artifacts:
    when: always
    paths:
      - target/allure-report
    expire_in: 1 week

pages:
  stage: pages
  dependencies:
    - allure-report
  script:
    - mkdir .public
    - cp -r target/allure-report/* .public
  artifacts:
    paths:
      - .public
  only:
    - main   # or your branch
