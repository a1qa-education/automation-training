stages:
  - test
  - report

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  SELENIUM_REMOTE_URL: "http://selenium:4444/wd/hub" # update if needed

# --- Stage 1: Run Selenium tests ---
selenium-tests:
  stage: test
  image: maven:3.9.3-eclipse-temurin-17
  services:
    - name: selenium/standalone-chrome:latest
      alias: selenium
  script:
    - mvn clean test
  artifacts:
    when: always
    paths:
      - target/allure-results
      - target/surefire-reports
    reports:
      junit: target/surefire-reports/*.xml

# --- Stage 2: Generate Allure report ---
allure-report:
  stage: report
  image: frankescobar/allure-docker-service:2.29.0
  dependencies:
    - selenium-tests
  script:
    - allure generate target/allure-results --clean -o target/allure-report
  artifacts:
    when: always
    paths:
      - target/allure-report
  only:
    - branches
