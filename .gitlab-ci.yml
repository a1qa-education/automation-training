stages:
  - test
  - report
  - pages

variables:
  MAVEN_CLI_OPTS: "-B -V"
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

unit-tests:
  stage: test
  image: maven:3.9.2-eclipse-temurin-17
  script:
    - mvn clean test
    - mkdir -p target/allure-results
  artifacts:
    name: "unit-tests-artifacts"
    paths:
      - target/allure-results
      - target/surefire-reports
    expire_in: 1 week
    when: always

allure-report:
  stage: report
  image: frankescobar/allure-docker-service:2.35.1
  dependencies:
    - unit-tests
  script:
    - allure generate target/allure-results --clean -o target/allure-report
  artifacts:
    name: "allure-report"
    paths:
      - target/allure-report
    expire_in: 1 week

pages:
  stage: pages
  image: alpine:3.18
  dependencies:
    - allure-report
  script:
    # Copy the Allure report to public/ for GitLab Pages
    - mkdir -p public
    - cp -r target/allure-report/* public/
  artifacts:
    paths:
      - public
  only:
    - branches
    - merge_requests