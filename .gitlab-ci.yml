image: maven:3.9.9-eclipse-temurin-17

stages:
  - test

services:
  - name: selenium/standalone-chrome:4.21.0
    alias: selenium

variables:
  SELENIUM_REMOTE_URL: "http://selenium:4444/wd/hub"
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

cache:
  paths:
    - .m2/repository

selenium-tests:
  stage: test

  before_script:
    - mkdir -p target/downloads

  script:
    - mvn clean test

  artifacts:
    when: always
    reports:
      junit: target/surefire-reports/*.xml
    paths:
      - target/surefire-reports/
      - target/downloads/
    expire_in: 7 days