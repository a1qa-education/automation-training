stages:
  - test
  - report

variables:
  MAVEN_CLI_OPTS: "-B -Dmaven.test.failure.ignore=false"

# Stage 1: Run tests
unit-tests:
  stage: test
  image: maven:3.9.2-eclipse-temurin-17
  services:
    - name: selenium/standalone-chrome:114.0
      alias: selenium
  script:
    - mvn $MAVEN_CLI_OPTS clean test
  artifacts:
    paths:
      - target/allure-results
      - target/surefire-reports
    expire_in: 1 week

# Stage 2: Generate Allure report
allure-report:
  stage: report
  image: frankescobar/allure-docker-service:2.29.0
  needs:
    - job: unit-tests
      artifacts: true
  script:
    # Ensure target/allure-results exists
    - mkdir -p target/allure-results
    - cp -r target/allure-results/* target/allure-results/
    # Generate report
    - allure generate target/allure-results --clean -o target/allure-report
  artifacts:
    paths:
      - target/allure-report
    expire_in: 1 week
